; POC layout mirrors Tessera ARCHITECTURE.md (firmware/components|widgets|boards).
; See docs/STRUCTURE.md. Product trunk remains Terrara repo — this validates the shape.

[platformio]
default_envs = jc3248w535
src_dir = firmware

[env:jc3248w535]
platform = espressif32
board = jc3248w535
framework = arduino
board_build.partitions = partitions.csv
upload_port = /dev/cu.usbmodem288485548A341
monitor_port = /dev/cu.usbmodem288485548A341
upload_speed = 921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
extra_scripts =
  pre:exclude_asm.py
  pre:tools/embed_web_pre.py
; Compile everything under firmware/ except empty board stubs if any.
build_src_filter = +<*>
build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -I${PROJECT_INCLUDE_DIR}
  -I${PROJECT_DIR}/firmware/components
  -I${PROJECT_DIR}/firmware/components/core_services
  -I${PROJECT_DIR}/firmware/components/ui_kit
  -I${PROJECT_DIR}/firmware/components/dashboard_shell
  -I${PROJECT_DIR}/firmware/components/web_configurator
  -I${PROJECT_DIR}/firmware/components/widget_sdk
  -I${PROJECT_DIR}/firmware/components/widget_runtime
  -I${PROJECT_DIR}/firmware/boards
  -I${PROJECT_DIR}/firmware/widgets/weather
  -I${PROJECT_DIR}/firmware/widgets/aitokens
  -I${PROJECT_DIR}/firmware/widgets/calendar
  -I${PROJECT_DIR}/firmware/widgets/mac
  -I${PROJECT_DIR}/firmware/widgets/media
  -I${PROJECT_DIR}/firmware/widgets/todoist
  -I${PROJECT_DIR}/firmware/widgets/clock
  -I${PROJECT_DIR}/firmware/widgets/greeting
  -I${PROJECT_DIR}/firmware/widgets/date
lib_deps =
  lvgl/lvgl@9.2.2
  moononournation/GFX Library for Arduino@^1.5.0
  bblanchon/ArduinoJson@^7.2.0
  test_ignore = test_native

; Host tests. Paths relative to src_dir=firmware.
[env:native]
platform = native
test_framework = unity
test_filter = test_native
test_build_src = true
extra_scripts = pre:tools/embed_web_pre.py
build_flags =
  -std=gnu++17
  -DTESSERA_PROJECT_DIR=\"${PROJECT_DIR}\"
  -I${PROJECT_DIR}/firmware/components
  -I${PROJECT_DIR}/firmware/components/core_services
  -I${PROJECT_DIR}/firmware/components/ui_kit
  -I${PROJECT_DIR}/firmware/components/dashboard_shell
  -I${PROJECT_DIR}/firmware/components/widget_sdk
  -I${PROJECT_DIR}/firmware/components/widget_runtime
  -I${PROJECT_DIR}/firmware/widgets/weather
  -I${PROJECT_DIR}/firmware/widgets/aitokens
  -I${PROJECT_DIR}/firmware/widgets/calendar
  -I${PROJECT_DIR}/firmware/widgets/mac
  -I${PROJECT_DIR}/firmware/widgets/media
  -I${PROJECT_DIR}/firmware/widgets/todoist
  -I${PROJECT_DIR}/firmware/widgets/clock
  -I${PROJECT_DIR}/firmware/widgets/greeting
  -I${PROJECT_DIR}/firmware/widgets/date
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_src_filter =
  +<components/ui_kit/ui/palette.cpp>
  +<components/dashboard_shell/app/nav.cpp>
  +<widgets/todoist/todoist/snapshot.cpp>
  +<components/core_services/services/todoist_bridge.cpp>
  +<widgets/weather/weather/*.cpp>
  +<widgets/aitokens/aitokens/*.cpp>
  +<widgets/calendar/calendar/*.cpp>
  +<widgets/mac/mac/*.cpp>
  +<widgets/media/media/*.cpp>
  +<../simulator/host/sd_host_stub.cpp>
  +<widgets/clock/clock_summary.cpp>
  +<components/core_services/agent/*.cpp>
  +<components/core_services/domain/dashboard_layout.cpp>
  +<components/core_services/domain/home_tile_size.cpp>
  +<components/core_services/platform/screen_rest.cpp>
  +<components/core_services/platform/widget_settings.cpp>
  +<components/core_services/platform/flash_trace.cpp>
  +<components/core_services/platform/weather_cache_store.cpp>
  +<components/core_services/platform/device_resources.cpp>
  +<components/widget_sdk/tessera/widget_context.cpp>
  +<components/widget_sdk/tessera/data.cpp>
  +<components/widget_sdk/tessera/memory_services.cpp>
  +<components/widget_sdk/tessera/host_clock.cpp>
  +<components/widget_runtime/tessera/runtime.cpp>
  +<components/dashboard_shell/platform/device_http.cpp>
  +<widgets/weather/weather/http_contract.cpp>
