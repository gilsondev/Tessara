name: Release please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A GITHUB_TOKEN tag push does not start other workflows. gh needs a
      # checkout; this job has none, so call the API directly.
      - name: Build the tagged agent
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release.outputs.tag_name }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agent-release.yml',
              ref: tag,
            });
            core.info(`dispatched agent-release.yml at ${tag}`);
