[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/usb",
  "crates/profile",
  "crates/scan",
  "crates/caps-media",
  "crates/caps-focus",
  "crates/caps-aitokens",
  "crates/caps-calendar",
  "crates/caps-todoist",
  "crates/doctor",
  "crates/logbuf",
  "crates/proc",
  "crates/agentd",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.2"

[workspace.dependencies]
serde = { version = "1", default-features = true, features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
