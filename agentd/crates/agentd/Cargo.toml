[package]
name = "agentd"
version.workspace = true
edition.workspace = true

# User-facing binary name for macOS TCC/FDA dialogs ("Tessera wants access…").
# Crate/package stays `agentd` for cargo; install/pack copy this name.
[[bin]]
name = "Tessera"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.7.9", features = ["json"] }
clap = { version = "=4.5.23", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.5.2", features = ["cors"] }
url = "=2.5.4"
tessera-protocol = { path = "../protocol" }
tessera-profile = { path = "../profile" }
tessera-scan = { path = "../scan" }
tessera-usb = { path = "../usb" }
tessera-caps-media = { path = "../caps-media" }
tessera-caps-focus = { path = "../caps-focus" }
tessera-caps-aitokens = { path = "../caps-aitokens" }
tessera-caps-calendar = { path = "../caps-calendar" }
tessera-caps-todoist = { path = "../caps-todoist" }
tessera-doctor = { path = "../doctor" }
tessera-logbuf = { path = "../logbuf" }
ureq = { version = "=2.12.1", default-features = true, features = ["tls"] }
sha2 = "=0.10.9"
hex = "=0.4.3"

[dev-dependencies]
tempfile = "=3.14.0"
